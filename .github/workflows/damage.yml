name: Snimak štete, bounty-ja i pool loota

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: damage
  cancel-in-progress: false

jobs:
  snimak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Snimi štetu i bounty članova MU
        run: node scripts/damage-snapshot.mjs
      - name: Snimi pool loot po rundama
        continue-on-error: true
        run: node scripts/pool-snapshot.mjs
      - name: Upiši promenu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/damage.json data/pool.json
          if git diff --cached --quiet; then echo "nema promena"; exit 0; fi
          git commit -m "Snimak štete $(date -u +%FT%H:%M)"
          # ako je neko drugi u međuvremenu upisao iste fajlove, preskoči ovaj sat (sledeći snimak nadoknađuje razliku)
          if git pull --rebase -q && git push; then echo "upisano"; else git rebase --abort 2>/dev/null; git reset --hard origin/main; echo "preskočeno zbog konflikta"; fi
