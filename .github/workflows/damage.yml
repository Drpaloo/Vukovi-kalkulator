name: Snimak štete i bounty-ja

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: damage
  cancel-in-progress: false

jobs:
  snimak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Snimi štetu i bounty članova MU
        run: node scripts/damage-snapshot.mjs
      - name: Upiši promenu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/damage.json
          if git diff --cached --quiet; then echo "nema promena"; else git commit -m "Snimak štete $(date -u +%FT%H:%M)"; git pull --rebase -q; git push; fi
