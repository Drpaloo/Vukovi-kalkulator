name: Snimak cena opreme

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Snimi cene opreme
        env:
          WARERA_API_KEY: ${{ secrets.WARERA_API_KEY }}
        run: node scripts/equipment-snapshot.mjs
      - name: Upiši promenu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/equipment.json
          if git diff --cached --quiet; then echo "nema promena"; else git commit -m "Snimak cena opreme $(date -u +%F\ %H:%M)"; git pull --rebase -q; git push; fi
