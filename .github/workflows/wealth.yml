name: Satni snimak bogatstva

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snimak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Snimi bogatstvo članova MU
        run: node scripts/wealth-snapshot.mjs
      - name: Upiši promenu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wealth.json
          if git diff --cached --quiet; then echo "nema promena"; else git commit -m "Snimak bogatstva $(date -u +%F\ %H:%M)"; git pull --rebase -q; git push; fi
